[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectis"
version = "0.3.0"
description = "Ultra-lightweight, zero-bloat autonomous multi-agent framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Vectis Core Architecture Team" }
]
keywords = [
    "multi-agent",
    "autonomous-agents",
    "llm",
    "orchestration",
    "memento",
    "sqlite",
    "lightweight"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
vectis = "main:main"

[project.urls]
Homepage = "https://github.com/muhaimin/vectis"
Repository = "https://github.com/muhaimin/vectis"
Documentation = "https://github.com/muhaimin/vectis/tree/main/docs"

[tool.setuptools]
packages = ["vectis"]
py-modules = [
    "agent_engine",
    "config",
    "heartbeat",
    "init_db",
    "main",
    "memory",
    "monitor",
    "tools",
    "web_ui",
]

[tool.setuptools.package-data]
"vectis" = ["schema.sql", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
